<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – TaskFlow</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <span class="brand-icon">T</span>
          <span>TaskFlow</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item active">📊 Dashboard</a>
        <a href="projects.html" class="nav-item">📁 Dự án</a>
        <a href="kanban.html" class="nav-item">📋 Kanban Board</a>
        <a href="profile.html" class="nav-item">👤 Hồ sơ cá nhân</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-secondary btn-full">🚪 Đăng xuất</button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
          <h1 class="page-title">Dashboard Tổng Quan</h1>
        </div>
        <div class="header-right">
          <a href="profile.html" class="user-chip">
            <span id="headerUserName">User</span>
            <div id="headerUserAvatar" class="avatar">U</div>
          </a>
        </div>
      </header>

      <main class="main-content">
        <!-- 5 THẺ KPI SỐ LIỆU -->
        <section class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Tổng số Dự án</div>
            <div class="kpi-value" id="statTotalProjects">0</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Tổng số Công việc</div>
            <div class="kpi-value" id="statTotalTasks">0</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Đã hoàn thành</div>
            <div class="kpi-value" style="color: var(--color-success);" id="statCompletedTasks">0</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Đang thực hiện</div>
            <div class="kpi-value" style="color: var(--color-info);" id="statInProgressTasks">0</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Quá hạn (Overdue)</div>
            <div class="kpi-value" style="color: var(--color-danger);" id="statOverdueTasks">0</div>
          </div>
        </section>

        <!-- THANH TIẾN ĐỘ TỔNG THỂ -->
        <section class="progress-card">
          <div class="progress-header">
            <span>Tiến độ hoàn thành tổng thể (Overall Progress)</span>
            <span id="statOverallProgress" style="color: var(--color-primary);">0%</span>
          </div>
          <div class="progress-bar">
            <div id="overallProgressBar" class="progress-fill" style="width: 0%;"></div>
          </div>
        </section>

        <!-- DANH SÁCH TÓM TẮT -->
        <section class="dashboard-grid">
          <div class="panel-card">
            <div class="panel-header">
              <h2 class="panel-title">Dự án gần đây</h2>
              <a href="projects.html" class="btn btn-ghost btn-sm">Xem tất cả &rarr;</a>
            </div>
            <div id="activeProjectsList" class="summary-list"></div>
          </div>

          <div class="panel-card">
            <div class="panel-header">
              <h2 class="panel-title">Công việc cần chú ý</h2>
              <a href="kanban.html" class="btn btn-ghost btn-sm">Mở Kanban &rarr;</a>
            </div>
            <div id="urgentTasksList" class="summary-list"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="js/storage.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
