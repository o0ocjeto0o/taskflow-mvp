<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản – TaskFlow</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-brand">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">T</span>
        <span>TaskFlow</span>
      </a>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Tạo tài khoản mới</h1>
      <p class="auth-subtitle">Bắt đầu quản lý công việc hiệu quả ngay hôm nay</p>

      <div id="authError" class="auth-alert hidden"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="regName">Tên hiển thị <span class="required">*</span></label>
          <input type="text" id="regName" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email <span class="required">*</span></label>
          <input type="email" id="regEmail" class="form-control" placeholder="sinhvien@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Mật khẩu (tối thiểu 6 ký tự) <span class="required">*</span></label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
          <input type="password" id="regConfirmPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-full">Đăng ký</button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
