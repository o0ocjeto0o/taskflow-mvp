<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập – TaskFlow</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-brand">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">T</span>
        <span>TaskFlow</span>
      </a>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Chào mừng trở lại</h1>
      <p class="auth-subtitle">Đăng nhập vào không gian làm việc TaskFlow</p>

      <div id="authError" class="auth-alert hidden"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email <span class="required">*</span></label>
          <input type="email" id="loginEmail" class="form-control" placeholder="sinhvien@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Mật khẩu <span class="required">*</span></label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-full">Đăng nhập</button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký miễn phí</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
